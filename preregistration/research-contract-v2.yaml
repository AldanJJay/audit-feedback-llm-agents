      measured_confirmation_cost: {deepseek: "USD 4.612", haiku: "USD 3.319", luna: "USD 1.951", openrouter_total: "USD 5.270"}
      spent_to_date: {deepseek: "USD 0.944", openrouter: "USD 1.664"}
