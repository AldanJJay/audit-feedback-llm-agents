      unit_rate: "Usage-bearing measured ledger USD/call, excluding unknown-usage upper bounds and 512-token projections; unrounded sums"
      spending: "All ledger rows including failed/duplicate/quarantined calls and conservative unknown-usage charges"
      expected_calls_per_block: {base: 240, sign_flip: 240, "null": 24, total: 504}
      maximum_calls_per_block_without_retries: 960
